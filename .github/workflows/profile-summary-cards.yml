name: GitHub-Advanced-Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Private & Organization Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          user: gkcalat
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          # Disable the crashing plugin
          plugin_habits: no

          # Deep line-level analysis across private & org repos
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, lines, percentage
          plugin_languages_limit: 8

          # PR reviews, issues, and good citizenship
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes
