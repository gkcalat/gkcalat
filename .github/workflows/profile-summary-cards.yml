name: GitHub-Advanced-Metrics

on:
  schedule:
    - cron: "* */24 * * *"
  workflow_dispatch:

jobs:
  build-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Private & Organization Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          user: gkcalat
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          # Include private repos & org activity
          config_order: base.header, isles, base.activity, base.community, habits, languages, followup
          
          # Lines of code (Deep inspection across public, private & org repos)
          plugin_languages: yes
          plugin_languages_indepth: yes # Clones repos to calculate lines added/deleted
          plugin_languages_analysis_timeout: 30
          plugin_languages_details: bytes-size, lines, percentage
          plugin_languages_limit: 8

          # Reviews, issues, and PR comments across all accessible repos
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes

          # Citizenship & coding habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_facts: yes
          plugin_habits_charts: yes
