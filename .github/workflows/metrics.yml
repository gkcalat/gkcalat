name: Update Profile Metrics & Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Compute Percentile & Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        run: python scripts/compute_percentile.py

      - name: Commit and push percentile card
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add percentile-card.svg
          git commit -m "Update percentile rank card [skip ci]" || echo "No changes to percentile-card.svg"
          git push origin master

      - name: Generate Detailed Code & Citizenship Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          user: gkcalat
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Los_Angeles

          # Avoid unhandled upstream parsing crash
          plugin_habits: no

          # Deep line analysis across private & org repos
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, lines, percentage
          plugin_languages_limit: 8

          # PR reviews, issues, and citizenship
          plugin_followup: yes
          plugin_followup_sections: user, repositories
          plugin_followup_indepth: yes
